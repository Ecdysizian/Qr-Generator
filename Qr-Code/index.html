<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator by Ecdysiz</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <h1>QR Code Generator by <span>Ecdysiz</span></h1>
    <p class="subtitle">Generate custom QR codes for URLs, text, and PDF files</p>

    <div class="container">
        <div class="tabs">
            <button class="tab active" data-tab="url">URL to QR</button>
            <button class="tab" data-tab="text">Text to QR</button>
            <button class="tab" data-tab="pdf">PDF to QR</button>
        </div>

        <div class="form-container">
            <div class="form-group">
                <label for="qrName">Name of QR Code</label>
                <input type="text" id="qrName" placeholder="MyQRCode" value="MyQRCode">
            </div>

            <!-- URL Tab Content -->
            <div class="tab-content active" id="url-tab">
                <div class="form-group">
                    <label for="urlInput">Enter URL</label>
                    <input type="text" id="urlInput" placeholder="https://ecdysiz.com/">
                    <p class="error-msg" id="urlError">Please enter a valid URL</p>
                </div>
            </div>

            <!-- Text Tab Content -->
            <div class="tab-content" id="text-tab">
                <div class="form-group">
                    <label for="textInput">Enter Text</label>
                    <input type="text" id="textInput" placeholder="Enter your text here">
                    <p class="error-msg" id="textError">Please enter some text</p>
                </div>
            </div>

            <!-- PDF Tab Content -->
            <div class="tab-content" id="pdf-tab">
                <div class="form-group">
                    <label for="pdfInput">Upload PDF File</label>
                    <input type="file" id="pdfInput" accept=".pdf">
                    <p class="error-msg" id="pdfError">Please select a PDF file</p>
                    <p class="pdf-size-warning" id="pdfSizeWarning">⚠️ Large PDF files may not scan properly. Keep under 500KB for best results.</p>
                    <div class="loading-indicator" id="pdfLoading">
                        <span class="spinner"></span> Processing PDF file...
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="qrSize">QR Code Size</label>
                <select id="qrSize">
                    <option value="128">Small (128x128)</option>
                    <option value="256" selected>Medium (256x256)</option>
                    <option value="512">Large (512x512)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="colorPicker">Choose QR Code Color</label>
                <div class="color-swatches">
                    <div class="color-swatch selected" data-color="#000000" style="background-color: #000000;"></div>
                    <div class="color-swatch" data-color="#0000FF" style="background-color: #0000FF;"></div>
                    <div class="color-swatch" data-color="#FF0000" style="background-color: #FF0000;"></div>
                    <div class="color-swatch" data-color="#008000" style="background-color: #008000;"></div>
                    <div class="color-swatch" data-color="#800080" style="background-color: #800080;"></div>
                    <div class="color-swatch" data-color="#FFA500" style="background-color: #FFA500;"></div>
                    <div class="color-swatch" data-color="#008080" style="background-color: #008080;"></div>
                </div><br>
                <label>You can choose your own color:</label>
                <input type="color" id="colorPicker" value="#000000">
              
            </div>

            <button class="btn" id="generateBtn">GENERATE QR CODE</button>
        </div>

        <div class="result-container" id="resultContainer">
            <div id="qrResult"></div>
            <div class="button-group">
                <button class="btn-preview" id="previewBtn">Preview</button>
                <button class="btn-download" id="downloadBtn"><i class="fa fa-download"></i> Download QR Code</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
